plugins {
    id 'base'
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-common"
}

configurations {
    // QUIC 门的自包含 netty 4.2 bundle:原样打包进资源目录,运行时由
    // QuicTransportProcess 解包进 child-first ClassLoader,绝不进主类路径
    // (与 Minecraft 自带的 netty 4.1 同包名隔离)。
    quicBundle
}

dependencies {
    api project(":common-sdk")
    implementation "com.google.code.gson:gson:${project.gson_version}"
    implementation "com.squareup.okhttp3:okhttp:${project.okhttp_version}"
    implementation "com.squareup.okio:okio-jvm:${project.okio_version}"
    compileOnly "org.slf4j:slf4j-api:${project.slf4j_version}"
    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    implementation "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
    // 压缩套下行解压(zstd-jni 与 vanilla 无重叠,Minecraft 未捆绑 zstd,可
    // 原样嵌套;1.20.5+ 的区块压缩用的是 lz4-java,见 1.21 版本 JSON)
    implementation "com.github.luben:zstd-jni:${project.zstd_jni_version}"
    implementation "org.luaj:luaj-jse:${project.luaj_version}"
    // 仅编译期可见(QuicTransportCore);运行期一律走 quicBundle 资源。
    compileOnly "io.netty:netty-codec-classes-quic:${project.netty_version}"
    quicBundle "io.netty:netty-codec-classes-quic:${project.netty_version}"
    quicBundle "io.netty:netty-common:${project.netty_version}"
    quicBundle "io.netty:netty-buffer:${project.netty_version}"
    quicBundle "io.netty:netty-transport:${project.netty_version}"
    quicBundle "io.netty:netty-resolver:${project.netty_version}"
    quicBundle "io.netty:netty-codec-base:${project.netty_version}"
    quicBundle "io.netty:netty-handler:${project.netty_version}"
    quicBundle "io.netty:netty-codec-native-quic:${project.netty_version}:linux-x86_64"
    quicBundle "io.netty:netty-codec-native-quic:${project.netty_version}:osx-aarch_64"
    quicBundle "io.netty:netty-codec-native-quic:${project.netty_version}:windows-x86_64"
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.slf4j:slf4j-simple:${project.slf4j_version}"
}

def protoModuleDir = rootProject.file("third_party/TeamViewRelay-Protocol")
def protoInputDir = new File(protoModuleDir, "proto")
def bufTemplateFile = file("buf.gen.yaml")
def generatedProtoJavaDir = file("${buildDir}/generated/source/proto/main/java")
def resolvedBufBinary = System.getenv("BUF_BIN") ?: (file("/tmp/buf/bin/buf").isFile() ? "/tmp/buf/bin/buf" : "buf")
def protoSources = project.fileTree(protoInputDir) {
    include("**/*.proto")
}

