interface ProtoExecOperations {
    void exec(Action<ExecSpec> action)
}

tasks.register("generateProtoJava") {
    def execOperations = project.objects.newInstance(InternalProtoExecOperations)

    group = "build setup"
    description = "Generate Java protobuf sources from the shared protocol module."

    inputs.files(protoSources)
    inputs.file(bufTemplateFile)
    outputs.dir(generatedProtoJavaDir)

    doLast {
        def transformedProto = file("${temporaryDir}/teamviewer/v1/teamviewer.proto")
        transformedProto.parentFile.mkdirs()
        execOperations.exec {
            commandLine("sed", "s/ExternalDatasetDescriptor descriptor =/ExternalDatasetDescriptor dataset_descriptor =/", rootProject.file("third_party/TeamViewRelay-Protocol/proto/teamviewer/v1/teamviewer.proto").absolutePath)
            standardOutput = transformedProto.newOutputStream()
        }
        // door.proto(0.9.0-alpha.4 传输层门控协议)原样带入,一并生成
        def doorProto = file("${temporaryDir}/teamviewer/door/v1/door.proto")
        doorProto.parentFile.mkdirs()
        doorProto.text = rootProject.file("third_party/TeamViewRelay-Protocol/proto/teamviewer/door/v1/door.proto").text
        execOperations.exec {
            commandLine(resolvedBufBinary, "generate", temporaryDir.absolutePath, "--template", bufTemplateFile.absolutePath, "-o", generatedProtoJavaDir.absolutePath)
        }
    }
}

// QUIC 门适配核(QuicTransportCore + QuicFrameCodec)单独成 jar 进资源:
// 运行时 child-first ClassLoader 从它定义这两个类,保证其 io.netty 4.2 引用
// 解析到 child URL 而非 parent 类路径(否则 parent 会先定义该类并与 MC 自带
// netty 4.1 错绑)。壳类 QuicTransportProcess 留在主 jar。
def quicCoreJar = tasks.register("quicCoreJar", Jar) {
    archiveBaseName = "teamviewer-quic-core"
    archiveClassifier = ""
    from(sourceSets.main.java.classesDirectory)
    // 两个适配核类及其全部嵌套/匿名内部类($* 通配,匿名 handler/trustManager
    // 也必须在 child 内定义,跨 loader 包级可见性会直接 IllegalAccessError)。
    include "fun/prof_chen/teamviewer/main_code/network/transport/quic/QuicTransportCore.class"
    include "fun/prof_chen/teamviewer/main_code/network/transport/quic/QuicTransportCore\$*.class"
    include "fun/prof_chen/teamviewer/main_code/network/transport/quic/QuicFrameCodec.class"
    include "fun/prof_chen/teamviewer/main_code/network/transport/quic/QuicFrameCodec\$*.class"
}

processResources {
    inputs.property "network_protocol_version", project.network_protocol_version
    inputs.property "network_min_compatible_protocol_version", project.network_min_compatible_protocol_version
    filteringCharset = "UTF-8"

    // QUIC 门 netty bundle 以 jar 原样进资源;运行时解包进 child-first
    // ClassLoader(下载类 native 另有 SHA-256 校验,见 QuicTransportProcess)。
    from(configurations.quicBundle) {
        into "META-INF/teamviewer/quic"
    }
    from(quicCoreJar.flatMap { it.archiveFile }) {
        into "META-INF/teamviewer/quic"
        rename { "teamviewer-quic-core.jar" }
    }

    filesMatching("teamviewer-build.properties") {
        expand(
                "network_protocol_version": project.network_protocol_version,
                "network_min_compatible_protocol_version": project.network_min_compatible_protocol_version
        )
    }
}

def targetJavaVersion = rootProject.ext.sharedJavaRelease as int

tasks.withType(JavaCompile).configureEach {
    dependsOn(tasks.named("generateProtoJava"))
    options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

configurations {
    legacyGsonTestRuntimeClasspath {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom(testRuntimeClasspath)
        resolutionStrategy.force "com.google.code.gson:gson:${project.gson_compat_version}"
    }
}

def legacyGsonTest = tasks.register("legacyGsonTest", Test) {
    group = "verification"
    description = "Run common tests with the Gson version supplied by Minecraft 1.18.2."
    dependsOn(tasks.named("testClasses"))
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.legacyGsonTestRuntimeClasspath
    shouldRunAfter(tasks.named("test"))
}

// NeoForge loads every JarJar dependency as a named JPMS module. common-sdk
// and common intentionally keep a compile-time boundary while sharing domain
// packages, so they must be one runtime module in NeoForge production jars.
def neoForgeRuntimeJar = tasks.register("neoForgeRuntimeJar", Jar) {
    group = "build"
    description = "Merge common-sdk and common into one NeoForge runtime module."
    archiveClassifier = "neoforge-runtime"
    dependsOn(tasks.named("classes"), project(":common-sdk").tasks.named("classes"))
    from(sourceSets.main.output)
    from(project(":common-sdk").sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes("Automatic-Module-Name": "fun.prof.chen.TeamViewRelay.common.runtime")
    }
}

configurations {
    neoForgeRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
        outgoing.capability("${project.group}:${project.name}-neoforge-runtime:${project.version}")
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, targetJavaVersion)
        }
    }
}

artifacts {
    neoForgeRuntimeElements(neoForgeRuntimeJar)
}

tasks.register("verifyPlatformBoundary") {
    group = "verification"
    description = "Ensure common main sources do not import Minecraft, Fabric, or optional map APIs."
    inputs.files(fileTree("src/main/java") { include "**/*.java" })

    doLast {
        def forbiddenImports = [
                "import net.minecraft.",
                "import net.fabricmc.",
                "import net.neoforged.",
                "import net.minecraftforge.",
                "import journeymap.",
                "import xaero."
        ]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            sourceFile.eachLine { line, lineNumber ->
                if (forbiddenImports.any { line.trim().startsWith(it) }) {
                    violations << "${sourceFile}:$lineNumber: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Platform imports leaked into common main sources:\n" + violations.join("\n"))
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyPlatformBoundary"), legacyGsonTest)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named("sourcesJar") {
    dependsOn(tasks.named("generateProtoJava"))
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-common"
            from components.java
        }
    }
}

abstract class InternalProtoExecOperations implements ProtoExecOperations {
    @javax.inject.Inject
    abstract ExecOperations getExecOperations()

    void exec(Action<ExecSpec> action) {
        execOperations.exec(action)
    }
}
