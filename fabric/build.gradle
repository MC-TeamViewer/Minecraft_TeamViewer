def verifyNoCommonClassShadowing = tasks.register("verifyNoCommonClassShadowing") {
    group = "verification"
    description = "Reject stale or version-specific bytecode that shadows classes supplied by common."
    dependsOn(tasks.named("compileClientJava"), project(":common").tasks.named("classes"),
            project(":common-sdk").tasks.named("classes"))

    doLast {
        def commonClasses = new HashSet<String>()
        [project(":common"), project(":common-sdk")].each { commonProject ->
            def classesRoot = commonProject.layout.buildDirectory.dir("classes/java/main").get().asFile
            fileTree(classesRoot) { include "**/*.class" }.files.each { classFile ->
                commonClasses.add(classesRoot.toPath().relativize(classFile.toPath()).toString())
            }
        }
        def shadowedClasses = []

        sourceSets.client.output.classesDirs.files.findAll { it.isDirectory() }.each { classesRoot ->
            fileTree(classesRoot) { include "**/*.class" }.files.each { classFile ->
                def relativePath = classesRoot.toPath().relativize(classFile.toPath()).toString()
                if (commonClasses.contains(relativePath)) {
                    shadowedClasses << relativePath
                }
            }
        }

        if (!shadowedClasses.isEmpty()) {
            throw new GradleException(
                    "Fabric adapter bytecode shadows Common SDK classes. " +
                            "Remove the duplicate source or run './gradlew clean' to clear stale outputs:\n" +
                            shadowedClasses.toSorted().join("\n"))
        }
    }
}

tasks.named("check") {
    dependsOn(verifyNoCommonClassShadowing, verifyMapPluginContracts)
}

def adapterArtifactDirectory = rootProject.layout.buildDirectory.dir("adapter-artifacts")
def adapterArtifactName = profileProperty("slim_adapter_artifact")
def generatedAdapterMetadataDirectory = layout.buildDirectory.dir("generated/adapter-metadata")
def productionJarTaskName = mappingsMode == "none" ? "jar" : "remapJar"
def normalizedPublicVersion = project.version.toString().replaceFirst(/^v/, "")
def internalAdapterVersion = "${normalizedPublicVersion}.mc.${minecraftTargetVersion.replaceAll(/[^0-9A-Za-z-]+/, '.')}"

def generateAdapterMetadata = tasks.register("generateAdapterMetadata") {
    group = "build"
    description = "Generate internal Fabric metadata for the selected slim adapter."
    outputs.dir(generatedAdapterMetadataDirectory)
    inputs.property("modVersion", project.version.toString())
    inputs.property("minecraftTargetVersion", minecraftTargetVersion)
    inputs.property("minecraftAdapterVersion", minecraftAdapterVersion)
    inputs.property("targetJavaVersion", targetJavaVersion)
    inputs.property("loaderVersion", loaderVersion)
    inputs.property("fabricApiVersion", fabricApiVersion)
    inputs.property("fabricApiModId", fabricApiModId)

    doLast {
        def outputRoot = generatedAdapterMetadataDirectory.get().asFile
        def adapterInfoRoot = new File(outputRoot, "META-INF/teamviewer")
        adapterInfoRoot.mkdirs()
        def fabricMetadata = [
                schemaVersion: 1,
                id: "team-view-relay-adapter",
                version: internalAdapterVersion,
                name: "TeamViewRelay Adapter ${minecraftTargetVersion}",
                description: "Internal Minecraft ${minecraftTargetVersion} adapter for TeamViewRelay.",
                environment: "client",
                depends: [
                        fabricloader: ">=${loaderVersion}",
                        minecraft: fabricMinecraftVersionRange,
                        java: ">=${targetJavaVersion}",
                        (fabricApiModId): "*"
                ],
                custom: ["teamviewer:internal": true]
        ]
        new File(outputRoot, "fabric.mod.json").text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(fabricMetadata))
        def adapterInfo = [
                minecraft: minecraftTargetVersion,
                adapter: minecraftAdapterVersion,
                internalModVersion: internalAdapterVersion,
                sharedJavaRelease: sharedJavaVersion,
                adapterJavaRelease: targetJavaVersion,
                gameJavaVersion: gameJavaVersion,
                loader: loaderVersion,
                fabricApiModId: fabricApiModId,
                fabricApi: fabricApiVersion,
                serviceProvider: "fun.prof_chen.teamviewer.main_code.core.FabricClientAdapterFactory"
        ]
        new File(adapterInfoRoot, "adapter.json").text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(adapterInfo))
    }
}

def remapAdapterJar = tasks.register("remapAdapterJar", Jar) {
    group = "build"
    description = "Extract the already-remapped Minecraft adapter into an internal slim Jar."
    dependsOn(tasks.named(productionJarTaskName), generateAdapterMetadata)
    archiveFileName.set(adapterArtifactName)
    destinationDirectory.set(adapterArtifactDirectory)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named(productionJarTaskName).get().archiveFile.get().asFile) }) {
        include "fun/**"
        exclude "fun/prof_chen/teamviewer/client/TeamviewerClient.class"
        include "META-INF/services/**"
        include "teamviewer.client.mixins.json"
        include "teamviewer.journeymap.mixins.json"
    }
    from(generatedAdapterMetadataDirectory)
}

def verifyAdapterArtifact = tasks.register("verifyAdapterArtifact") {
    group = "verification"
    description = "Verify slim adapter contents, metadata, service provider, Mixin and bytecode release."
    dependsOn(remapAdapterJar)
    inputs.file(remapAdapterJar.flatMap { it.archiveFile })

    doLast {
        def adapterFile = remapAdapterJar.get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(adapterFile)
        try {
            def entryNames = zip.entries().collect { it.name } as Set
            def requiredEntries = [
                    "fabric.mod.json",
                    "META-INF/teamviewer/adapter.json",
                    "META-INF/services/fun.prof_chen.teamviewer.main_code.client.sdk.ClientAdapterFactory",
                    "teamviewer.client.mixins.json",
                    "teamviewer.journeymap.mixins.json"
            ]
            def missing = requiredEntries.findAll { !entryNames.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Slim adapter ${minecraftTargetVersion} is missing: ${missing}")
            }
            def forbiddenPrefixes = [
                    "fun/prof_chen/teamviewer/client/TeamviewerClient",
                    "fun/prof_chen/teamviewer/main_code/client/ClientApplication",
                    "fun/prof_chen/teamviewer/main_code/client/ClientCoordinator",
                    "fun/prof_chen/teamviewer/protocol/",
                    "okhttp3/", "okio/", "com/fasterxml/jackson/", "com/google/protobuf/"
            ]
            def forbidden = entryNames.findAll { name -> forbiddenPrefixes.any { name.startsWith(it) } }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Slim adapter contains shared/runtime classes: ${forbidden.toSorted()}")
            }
            def sharedClasses = new HashSet<String>()
            [project(":common"), project(":common-sdk")].each { sharedProject ->
                def classesRoot = sharedProject.layout.buildDirectory.dir("classes/java/main").get().asFile
                fileTree(classesRoot) { include "**/*.class" }.files.each { classFile ->
                    sharedClasses.add(classesRoot.toPath().relativize(classFile.toPath()).toString().replace('\\', '/'))
                }
            }
            def sharedOverlap = entryNames.findAll { sharedClasses.contains(it) }
            if (!sharedOverlap.isEmpty()) {
                throw new GradleException("Slim adapter shadows Common SDK/runtime classes: ${sharedOverlap.toSorted()}")
            }
            def providerEntry = zip.getEntry(requiredEntries[2])
            def providers = zip.getInputStream(providerEntry).getText("UTF-8").readLines()
                    .collect { it.trim() }.findAll { !it.isEmpty() && !it.startsWith("#") }
            if (providers != ["fun.prof_chen.teamviewer.main_code.core.FabricClientAdapterFactory"]) {
                throw new GradleException("Slim adapter must expose exactly one factory; found ${providers}")
            }
            def mixin = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry("teamviewer.client.mixins.json")))
            if (!(mixin.client instanceof List) || mixin.client.isEmpty()) {
                throw new GradleException("Slim adapter must contain a non-empty client Mixin list")
            }
            if (mixin.compatibilityLevel != "JAVA_${targetJavaVersion}") {
                throw new GradleException(
                        "Slim adapter Mixin compatibility ${mixin.compatibilityLevel} does not match Java ${targetJavaVersion}")
            }
            def journeyMapMixin = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry("teamviewer.journeymap.mixins.json")))
            if (journeyMapMixin.compatibilityLevel != "JAVA_${targetJavaVersion}") {
                throw new GradleException("JourneyMap Mixin compatibility ${journeyMapMixin.compatibilityLevel} "
                        + "does not match Java ${targetJavaVersion}")
            }
            if (!(journeyMapMixin.client instanceof List)) {
                throw new GradleException("JourneyMap Mixin config must declare a client list")
            }
            if (!journeyMapMixin.client.isEmpty()) {
                def expectedPlugin = "fun.prof_chen.teamviewer.integration.journeymap.JourneyMapMixinConfigPlugin"
                if (journeyMapMixin.plugin != expectedPlugin) {
                    throw new GradleException("JourneyMap Mixin config must use ${expectedPlugin}")
                }
                def mixinPackagePath = String.valueOf(journeyMapMixin.package).replace('.', '/')
                journeyMapMixin.client.each { mixinName ->
                    def mixinClass = "${mixinPackagePath}/${mixinName}.class".toString()
                    if (!entryNames.contains(mixinClass)) {
                        throw new GradleException("JourneyMap Mixin config references missing ${mixinClass}")
                    }
                }
                def pluginClass = expectedPlugin.replace('.', '/') + ".class"
                if (!entryNames.contains(pluginClass)) {
                    throw new GradleException("JourneyMap Mixin config references missing ${pluginClass}")
                }
            }
            int expectedMajor = targetJavaVersion + 44
            int maximumMajor = 0
            entryNames.findAll { it.endsWith(".class") }.each { name ->
                byte[] header = new byte[8]
                def stream = zip.getInputStream(zip.getEntry(name))
                try {
                    if (stream.read(header) != 8) throw new GradleException("Invalid class entry ${name}")
                } finally {
                    stream.close()
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                maximumMajor = Math.max(maximumMajor, major)
                if (major > expectedMajor) {
                    throw new GradleException("${name} has class major ${major}, expected <= ${expectedMajor}")
                }
            }
            if (maximumMajor != expectedMajor) {
                throw new GradleException("Slim adapter maximum class major ${maximumMajor}, expected ${expectedMajor}")
            }
        } finally {
            zip.close()
        }
    }
}

def verifyStandaloneArtifact = tasks.register("verifyStandaloneArtifact") {
    group = "verification"
    description = "Verify the selected standalone Jar remains complete and directly installable."
    dependsOn(tasks.named(productionJarTaskName), ":fabric-bootstrap:jar", ":client-bootstrap:jar",
            ":common:jar", ":common-sdk:jar")
    inputs.file(tasks.named(productionJarTaskName).flatMap { it.archiveFile })

    doLast {
        def standaloneFile = tasks.named(productionJarTaskName).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(standaloneFile)
        try {
            def entryNames = zip.entries().collect { it.name }
            def entries = entryNames as Set
            def descriptorEntry = zip.getEntry("fabric.mod.json")
            if (descriptorEntry == null) throw new GradleException("Standalone is missing fabric.mod.json")
            if (!entries.contains("pack.mcmeta")) {
                throw new GradleException("Standalone is missing ResourcePack metadata")
            }
            def descriptor = new groovy.json.JsonSlurper().parse(zip.getInputStream(descriptorEntry))
            if (descriptor.id != "team-view-relay"
                    || descriptor.depends?.minecraft != fabricMinecraftVersionRange
                    || descriptor.depends?.java != ">=${gameJavaVersion}") {
                throw new GradleException("Standalone metadata does not match target ${minecraftTargetVersion}")
            }
            def expectedMixinConfigs = [
                    [config: "teamviewer.client.mixins.json", environment: "client"],
                    [config: "teamviewer.journeymap.mixins.json", environment: "client"]
            ]
            def actualMixinConfigs = descriptor.mixins?.collect {
                [config: String.valueOf(it.config), environment: String.valueOf(it.environment)]
            }
            if (actualMixinConfigs != expectedMixinConfigs) {
                throw new GradleException("Standalone Mixin configs ${actualMixinConfigs} "
                        + "do not match ${expectedMixinConfigs}")
            }
            def nested = entryNames.findAll { it.startsWith("META-INF/jars/") && it.endsWith(".jar") }
            def requiredNestedPrefixes = [
                    "TeamViewRelay-common-", "TeamViewRelay-common-sdk-",
                    "okhttp-", "okio-jvm-", "kotlin-stdlib-", "protobuf-java-", "protobuf-java-util-", "luaj-jse-",
                    "zstd-jni-"
            ]
            requiredNestedPrefixes.each { prefix ->
                def matches = nested.findAll { name ->
                    def fileName = name.substring("META-INF/jars/".length())
                    if (prefix == "TeamViewRelay-common-") {
                        return fileName.startsWith(prefix) && !fileName.startsWith("TeamViewRelay-common-sdk-")
                    }
                    if (prefix == "protobuf-java-") {
                        return fileName.startsWith(prefix) && !fileName.startsWith("protobuf-java-util-")
                    }
                    fileName.startsWith(prefix)
                }
                if (matches.size() != 1) {
                    throw new GradleException("Standalone requires exactly one ${prefix} nested Jar; found ${matches}")
                }
            }
            if (nested.any { it.contains("teamviewer-adapter-") }) {
                throw new GradleException("Standalone must flatten its adapter instead of exposing the internal adapter ID")
            }
            if (nested.any { it.substring("META-INF/jars/".length()).startsWith("jackson-") }) {
                throw new GradleException("Standalone must not duplicate Minecraft's Jackson modules")
            }
            if (nested.any { it.substring("META-INF/jars/".length()).startsWith("gson-") }
                    || entries.any { it.startsWith("com/google/gson/") }) {
                throw new GradleException("Standalone must use Minecraft's Gson instead of bundling an unrelocated copy")
            }
            nested.each { nestedName ->
                def nestedZip = new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry(nestedName)))
                try {
                    java.util.zip.ZipEntry nestedEntry
                    while ((nestedEntry = nestedZip.nextEntry) != null) {
                        if (nestedEntry.name.startsWith("com/google/gson/")) {
                            throw new GradleException(
                                    "Standalone nested Jar ${nestedName} contains unrelocated Gson classes")
                        }
                    }
                } finally {
                    nestedZip.close()
                }
            }
            if (!entries.contains("fun/prof_chen/teamviewer/client/TeamviewerClient.class")) {
                throw new GradleException("Standalone is missing the shared Java 17 bootstrap entrypoint")
            }
            if (!entries.contains("fun/prof_chen/teamviewer/client/bootstrap/ClientBootstrap.class")) {
                throw new GradleException("Standalone is missing the Loader-neutral Java 17 client bootstrap")
            }
            def providerPath = "META-INF/services/fun.prof_chen.teamviewer.main_code.client.sdk.ClientAdapterFactory"
            def providerEntries = entryNames.findAll { it == providerPath }
            if (providerEntries.size() != 1) {
                throw new GradleException("Standalone must contain exactly one adapter provider resource")
            }
            def providers = zip.getInputStream(zip.getEntry(providerPath)).getText("UTF-8").readLines()
                    .collect { it.trim() }.findAll { !it.isEmpty() && !it.startsWith("#") }
            if (providers.size() != 1) {
                throw new GradleException("Standalone must expose exactly one adapter factory; found ${providers}")
            }
            if (!entries.contains("teamviewer.client.mixins.json")) {
                throw new GradleException("Standalone is missing its target Mixin config")
            }
            if (!entries.contains("teamviewer.journeymap.mixins.json")) {
                throw new GradleException("Standalone is missing its JourneyMap Mixin config")
            }
            def mixin = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry("teamviewer.client.mixins.json")))
            if (mixin.compatibilityLevel != "JAVA_${targetJavaVersion}") {
                throw new GradleException(
                        "Standalone Mixin compatibility ${mixin.compatibilityLevel} does not match Java ${targetJavaVersion}")
            }
        } finally {
            zip.close()
        }
    }
}

