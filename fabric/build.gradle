def compileVersionAdapterAgainstSdk = tasks.register("compileVersionAdapterAgainstSdk", JavaCompile) {
    group = "verification"
    description = "Compile Minecraft adapter sources without the common runtime on their classpath."
    dependsOn(project(":common-sdk").tasks.named("classes"))
    dependsOn(generateAdapterBuildProfile)
    if (journeyMapApiNestedPath != null) {
        dependsOn(tasks.named("extractJourneyMapApi"))
    }
    source(adapterSourceLayout.javaFiles)
    source(generatedAdapterProfileDir)
    classpath = sourceSets.client.compileClasspath - project(":common").sourceSets.main.output
