plugins {
    id 'fabric-loom' apply false
    id 'net.fabricmc.fabric-loom' apply false
    id 'maven-publish'
}

apply from: rootProject.file("gradle/adapter-source-layers.gradle")
apply from: rootProject.file("gradle/minecraft-target-profiles.gradle")

evaluationDependsOn(":fabric-bootstrap")

def minecraftVersionProperties = new Properties()
rootProject.file("gradle/minecraft-versions.properties").withInputStream {
    minecraftVersionProperties.load(it)
}
def mapModVersionProperties = new Properties()
rootProject.file("gradle/map-mod-versions.properties").withInputStream {
    mapModVersionProperties.load(it)
}
def defaultMinecraftTarget = minecraftVersionProperties.getProperty("default_fabric_target")
def minecraftTarget = providers.gradleProperty("fabric_target")
        .getOrElse(defaultMinecraftTarget)
def supportedMinecraftTargets = minecraftVersionProperties.getProperty("fabric_targets")
        .split(",")
        .collect { it.trim() }
if (!supportedMinecraftTargets.contains(minecraftTarget)) {
    throw new GradleException("Unsupported fabric_target '${minecraftTarget}'. Supported targets: ${supportedMinecraftTargets.join(', ')}")
}
def selectedProfile = normalizedMinecraftProfile(
        minecraftVersionProperties, "fabric", minecraftTarget, project.archives_base_name.toString())
def profileProperty = { String name ->
    def value = selectedProfile[name]
    if (value == null || value.isBlank()) {
        throw new GradleException("Missing ${name} for Minecraft target ${minecraftTarget}")
    }
    value
}
def familyMinecraftVersion = profileProperty("minecraft_target_version")
def minecraftTargetVersion = providers.gradleProperty("fabric_runtime_version")
        .getOrElse(familyMinecraftVersion)
def supportedRuntimeVersions = minecraftVersionProperties.getProperty("official_releases")
        .split(",").collect { it.trim() }
if (!supportedRuntimeVersions.contains(minecraftTargetVersion)) {
    throw new GradleException("Unsupported Fabric runtime '${minecraftTargetVersion}'")
}
def runtimeOwner = minecraftVersionProperties.getProperty("fabric_runtime.${minecraftTargetVersion}.owner")
if (runtimeOwner != minecraftTarget) {
    throw new GradleException(
            "Fabric runtime ${minecraftTargetVersion} belongs to ${runtimeOwner}, not ${minecraftTarget}")
}
def runtimeProperty = { String name ->
    minecraftVersionProperties.getProperty("fabric_runtime.${minecraftTargetVersion}.${name}")
}
def fabricMinecraftVersionRange = profileProperty("minecraft_version_range")
def minecraftAdapterVersion = profileProperty("adapter_version")
def adapterSourceLayout = resolveAdapterSourceLayers(file("src"), minecraftAdapterVersion)
def targetJavaVersion = profileProperty("adapter_java_release").toInteger()
def gameJavaVersion = profileProperty("game_java_version").toInteger()
def sharedJavaVersion = minecraftVersionProperties.getProperty("shared_java_release").toInteger()
def loaderVersion = profileProperty("loader_version")
def fabricApiVersion = runtimeProperty("fabric_api_version") ?: profileProperty("fabric_api_version")
def fabricApiModId = profileProperty("fabric_api_mod_id")
def mappingsMode = runtimeProperty("mappings_mode") ?: profileProperty("mappings_mode")
def yarnMappings = runtimeProperty("yarn_mappings") ?: minecraftVersionProperties.getProperty(
        "fabric.${minecraftTarget}.yarn_mappings")
def modmenuVersion = profileProperty("modmenu_version")
def journeyMapDependency = profileProperty("journeymap_dependency")
def parseMapDeclaration = { String plugin ->
    def value = mapModVersionProperties.getProperty("map.${minecraftTargetVersion}.${plugin}")
    if (value == null || value.isBlank()) {
        throw new GradleException("Missing exact ${plugin} declaration for Minecraft ${minecraftTargetVersion}")
    }
    value.split(/\|/).toList()
}
def journeyMapDeclaration = parseMapDeclaration("journeymap")
def xaeroDeclaration = parseMapDeclaration("xaero")
def journeyMapApiFamily = journeyMapDeclaration[0]
def journeyMapTestDependency = journeyMapDeclaration.size() > 1 ? journeyMapDeclaration[1] : null
def journeyMapPluginSource = adapterSourceLayout.file(
        "java/fun/prof_chen/teamviewer/main_code/mapbridge/provider/journey/JourneyMapClientPlugin.java")
// JourneyMap's Waypoint feature family and plugin annotation package evolved independently.
def journeyMapAnnotationImports = [
        client: "import journeymap.api.v2.client.JourneyMapPlugin;",
        common: "import journeymap.api.v2.common.JourneyMapPlugin;"
]
def journeyMapAnnotationClasses = [
        client: "journeymap/api/v2/client/JourneyMapPlugin.class",
        common: "journeymap/api/v2/common/JourneyMapPlugin.class"
]
def journeyMapAnnotationKind = { File source ->
    def sourceText = source.getText("UTF-8")
    def matches = journeyMapAnnotationImports.findAll { entry ->
        sourceText.contains(entry.value)
    }.keySet().toList()
    if (matches.size() != 1 || sourceText.count("@JourneyMapPlugin(apiVersion = \"2.0.0\")") != 1) {
        throw new GradleException(
                "${minecraftAdapterVersion} JourneyMap entrypoint must import and use exactly one supported v2 annotation")
    }
    matches[0]
}
def xaeroApiFamily = xaeroDeclaration[0]
def xaeroMinimapTestDependency = xaeroDeclaration.size() > 1 ? xaeroDeclaration[1] : null
def xaeroWorldMapTestDependency = xaeroDeclaration.size() > 2 ? xaeroDeclaration[2] : null
def journeyMapApiNestedPath = minecraftVersionProperties.getProperty(
        "fabric.${minecraftTarget}.journeymap_api_nested_path")
def journeyMapApiJar = journeyMapApiNestedPath != null
        ? layout.buildDirectory.file("generated/journeymap-api/${journeyMapApiNestedPath}")
        : null
def standaloneArtifactSuffix = "-{mod_version}.jar"
def standaloneArtifact = profileProperty("standalone_artifact")
if (!standaloneArtifact.endsWith(standaloneArtifactSuffix)) {
    throw new GradleException(
            "Fabric standalone_artifact must end with ${standaloneArtifactSuffix}: ${standaloneArtifact}")
}
def standaloneArchivesName = standaloneArtifact.substring(
        0, standaloneArtifact.length() - standaloneArtifactSuffix.length())

apply plugin: mappingsMode == "yarn" ? "fabric-loom" : "net.fabricmc.fabric-loom"

base {
    archivesName = standaloneArchivesName
}

if (minecraftTargetVersion != familyMinecraftVersion) {
    layout.buildDirectory = file("build/${minecraftTarget}/runtime/${minecraftTargetVersion}")
} else if (minecraftTarget != defaultMinecraftTarget) {
    layout.buildDirectory = file("build/${minecraftTarget}")
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            runDir = minecraftTarget == defaultMinecraftTarget ? "run" : "run/${minecraftTargetVersion}"
            vmArg "-Dteamviewer.adapterTck.strict=true"
        }
    }

    mods {
        "teamviewer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "JourneyMap"
        url = "https://jm.gserv.me/repository/maven-snapshots/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java"]
        resources.srcDirs = ["src/main/resources"]
    }
    client {
        java.srcDirs = []
        resources.srcDirs = []
    }
}

def generatedAdapterProfileDir = layout.buildDirectory.dir("generated/sources/adapterProfile/java")
def generateAdapterBuildProfile = tasks.register("generateAdapterBuildProfile") {
    inputs.property("adapterId", minecraftAdapterVersion)
    outputs.dir(generatedAdapterProfileDir)
    doLast {
        def packageDir = generatedAdapterProfileDir.get().dir(
                "fun/prof_chen/teamviewer/main_code/core").asFile
        packageDir.mkdirs()
        new File(packageDir, "AdapterBuildProfile.java").setText(
                """package fun.prof_chen.teamviewer.main_code.core;

/** Generated identity for the selected adapter source family. */
final class AdapterBuildProfile {
    static final String ADAPTER_ID = \"${minecraftAdapterVersion}\";

    private AdapterBuildProfile() { }
}
""", "UTF-8")
    }
}
configureAdapterSourceSet(
        sourceSets.client, adapterSourceLayout, [generatedAdapterProfileDir.get().asFile])
tasks.named("compileClientJava") {
    dependsOn(generateAdapterBuildProfile)
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            def group = details.requested.group
            def name = details.requested.name
            def gsonRequiredVersion = project.gson_version.toString()
            def slf4jRequiredVersion = project.slf4j_version.toString()

            if (group == 'com.google.code.gson' && name == 'gson') {
                details.useVersion gsonRequiredVersion
            } else if (group == 'org.slf4j' && name == 'slf4j-api') {
                details.useVersion slf4jRequiredVersion
            }
        }
    }
}

configurations {
    mapPluginContracts
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftTargetVersion}"
    if (mappingsMode == "yarn") {
        if (yarnMappings == null || yarnMappings.isBlank()) {
            throw new GradleException("Missing Yarn mappings for exact runtime ${minecraftTargetVersion}")
        }
        mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    } else if (mappingsMode != "none") {
        throw new GradleException("Unsupported mappings mode '${mappingsMode}' for ${minecraftTarget}")
    }
    if (mappingsMode == "yarn") {
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        modCompileOnly("com.terraformersmc:modmenu:${modmenuVersion}") {
            transitive = false
        }
        modLocalRuntime("com.terraformersmc:modmenu:${modmenuVersion}") {
            transitive = false
        }
        modCompileOnly(journeyMapDependency) {
            transitive = false
        }
        if (journeyMapTestDependency != null) {
            modLocalRuntime(journeyMapTestDependency) {
                transitive = false
            }
        }
        [xaeroMinimapTestDependency, xaeroWorldMapTestDependency].findAll { it != null }.each { dependency ->
            modLocalRuntime(dependency) { transitive = false }
        }
        if (journeyMapApiJar != null) {
            modCompileOnly files(journeyMapApiJar)
        }
    } else {
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        runtimeOnly "com.terraformersmc:modmenu:${modmenuVersion}"
        compileOnly journeyMapDependency
        if (journeyMapTestDependency != null) runtimeOnly journeyMapTestDependency
        if (xaeroMinimapTestDependency != null) runtimeOnly xaeroMinimapTestDependency
        if (xaeroWorldMapTestDependency != null) runtimeOnly xaeroWorldMapTestDependency
        if (journeyMapApiJar != null) {
            compileOnly files(journeyMapApiJar)
        }
    }

    implementation project(":common")
    include project(":common")
    implementation project(":common-sdk")
    include project(":common-sdk")

    implementation project(":fabric-bootstrap")

    implementation "com.squareup.okhttp3:okhttp:${project.okhttp_version}"
    include "com.squareup.okhttp3:okhttp:${project.okhttp_version}"

    implementation "com.squareup.okio:okio-jvm:${project.okio_version}"
    include "com.squareup.okio:okio-jvm:${project.okio_version}"

    // This Java-only project pins the stdlib bundled for OkHttp/Okio; there is no Kotlin Gradle plugin version.
    //noinspection DifferentStdlibGradleVersion
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
    include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"

    implementation "com.google.protobuf:protobuf-java:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java:${project.protobuf_version}"

    implementation "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"
    include "com.google.protobuf:protobuf-java-util:${project.protobuf_version}"

    // 压缩套下行解压;vanilla 未捆绑 zstd,原样嵌套(Minecraft 1.20.5+ 区块
    // 压缩用的是 lz4-java,与 zstd-jni 无重叠)
    implementation "com.github.luben:zstd-jni:${project.zstd_jni_version}"
    include "com.github.luben:zstd-jni:${project.zstd_jni_version}"

    implementation "org.luaj:luaj-jse:${project.luaj_version}"
    include "org.luaj:luaj-jse:${project.luaj_version}"

    if (journeyMapTestDependency != null) {
        mapPluginContracts(journeyMapTestDependency) { transitive = false }
    }
    if (xaeroMinimapTestDependency != null) {
        mapPluginContracts(xaeroMinimapTestDependency) { transitive = false }
    }
    if (xaeroWorldMapTestDependency != null) {
        mapPluginContracts(xaeroWorldMapTestDependency) { transitive = false }
    }
}

def verifyMapPluginContracts = tasks.register("verifyMapPluginContracts") {
    group = "verification"
    description = "Resolve fixed official map Mods and verify the exact API family signatures."
    inputs.property("minecraftVersion", minecraftTargetVersion)
    inputs.property("journeyMapApiFamily", journeyMapApiFamily)
    inputs.property("xaeroApiFamily", xaeroApiFamily)
    if (journeyMapTestDependency != null || xaeroMinimapTestDependency != null
            || xaeroWorldMapTestDependency != null) {
        inputs.files(configurations.mapPluginContracts)
    }
    if (journeyMapApiFamily.startsWith("api-v2")) {
        inputs.file(journeyMapPluginSource)
    }

    doLast {
        def artifacts = configurations.mapPluginContracts.resolvedConfiguration.resolvedArtifacts
                .collectEntries { [(it.moduleVersion.id.name): it.file] }
        def classBytes = { File outerJar, String path ->
            def outer = new java.util.zip.ZipFile(outerJar)
            try {
                def direct = outer.getEntry(path)
                if (direct != null) return outer.getInputStream(direct).bytes
                def nestedEntries = outer.entries().findAll {
                    it.name.startsWith("META-INF/jars/") && it.name.endsWith(".jar")
                }
                for (def nested : nestedEntries) {
                    def input = new java.util.zip.ZipInputStream(outer.getInputStream(nested))
                    try {
                        for (def entry = input.nextEntry; entry != null; entry = input.nextEntry) {
                            if (entry.name == path) return input.bytes
                        }
                    } finally {
                        input.close()
                    }
                }
                return null
            } finally {
                outer.close()
            }
        }
        def requireClass = { File jar, String path ->
            def bytes = classBytes(jar, path)
            if (bytes == null) throw new GradleException("${jar.name} is missing ${path}")
            new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
        }
        def requireTokens = { String source, String label, List<String> tokens ->
            def missing = tokens.findAll { !source.contains(it) }
            if (!missing.isEmpty()) throw new GradleException("${label} is missing API tokens ${missing}")
        }

        if (journeyMapApiFamily != "unsupported") {
            def jar = artifacts["journeymap"]
            if (jar == null) throw new GradleException("JourneyMap contract artifact did not resolve")
            if (journeyMapApiFamily == "api-v1-merged") {
                requireTokens(requireClass(jar, "journeymap/client/api/IClientAPI.class"),
                        "JourneyMap ${minecraftTargetVersion} IClientAPI",
                        ["getAllWaypoints", "show", "remove"])
                requireTokens(requireClass(jar, "journeymap/client/api/display/Waypoint.class"),
                        "JourneyMap ${minecraftTargetVersion} Waypoint",
                        ["setPosition", "getPosition", "setPersistent", "setEnabled"])
                requireTokens(requireClass(jar, "journeymap/client/api/model/WaypointBase.class"),
                        "JourneyMap ${minecraftTargetVersion} WaypointBase", ["setColor"])
            } else {
                def annotationKind = journeyMapAnnotationKind(journeyMapPluginSource)
                def pluginAnnotationPath = journeyMapAnnotationClasses[annotationKind]
                requireClass(jar, pluginAnnotationPath)
                def waypoint = requireClass(jar, "journeymap/api/v2/common/waypoint/Waypoint.class")
                def factory = requireClass(jar, "journeymap/api/v2/common/waypoint/WaypointFactory.class")
                requireTokens(requireClass(jar, "journeymap/api/v2/client/IClientAPI.class"),
                        "JourneyMap ${minecraftTargetVersion} IClientAPI",
                        ["getAllWaypoints", "addWaypoint", "removeWaypoint"])
                requireTokens(waypoint, "JourneyMap ${minecraftTargetVersion} Waypoint",
                        ["getPrimaryDimension", "getBlockPos", "setPos", "setColor"])
                if (journeyMapApiFamily == "api-v2-full") {
                    requireTokens(waypoint, "JourneyMap ${minecraftTargetVersion} full Waypoint",
                            ["setShowBeacon", "setShowOnMap", "setShowInWorld"])
                } else if (["setShowBeacon", "setShowOnMap", "setShowInWorld"].any { waypoint.contains(it) }) {
                    throw new GradleException("JourneyMap ${minecraftTargetVersion} merged family unexpectedly has presentation controls")
                }
                requireTokens(factory, "JourneyMap ${minecraftTargetVersion} WaypointFactory",
                        [minecraftTargetVersion == "26.2" ? "createWaypoint" : "createClientWaypoint"])
                if (["26.1.2", "26.2"].contains(minecraftTargetVersion)) {
                    def group = requireClass(jar, "journeymap/api/v2/common/waypoint/WaypointGroup.class")
                    requireTokens(requireClass(jar, "journeymap/api/v2/client/IClientAPI.class"),
                            "JourneyMap ${minecraftTargetVersion} waypoint groups",
                            ["getWaypointGroupByName", "getAllWaypointGroups", "getWorldId", "addWaypointGroup"])
                    requireTokens(factory, "JourneyMap ${minecraftTargetVersion} WaypointFactory groups",
                            ["createWaypointGroup"])
                    requireTokens(group, "JourneyMap ${minecraftTargetVersion} WaypointGroup",
                            ["getGuid", "getModId", "setTag", "setPersistent", "getCustomData",
                             "setCustomData", "addWaypoint"])
                }
                if (minecraftTargetVersion == "26.1.2") {
                    requireTokens(requireClass(jar,
                            "journeymap/client/event/handlers/WaypointBeaconHandler.class"),
                            "JourneyMap 26.1.2 beacon handler", ["onRenderWaypoints", "renderWaypointsWorld"])
                    requireTokens(requireClass(jar, "journeymap/client/ui/UIManager.class"),
                            "JourneyMap 26.1.2 UI manager", ["drawWaypointDecorations", "renderWaypointsWorld"])
                    requireTokens(requireClass(jar,
                            "journeymap/client/render/ingame/WaypointRenderer.class"),
                            "JourneyMap 26.1.2 waypoint renderer",
                            ["canDrawWaypoint", "renderWaypoint", "beaconEnabled", "maxDistance"])
                    requireTokens(requireClass(jar,
                            "journeymap/client/render/ingame/WaypointBeaconRenderer.class"),
                            "JourneyMap 26.1.2 beacon renderer", ["showRotatingBeam", "showStaticBeam"])
                    requireTokens(requireClass(jar,
                            "journeymap/client/render/ingame/WaypointDecorationRenderer.class"),
                            "JourneyMap 26.1.2 decoration renderer",
                            ["waypointsToDraw", "showRotatingBeam", "showStaticBeam"])
                }
            }
        }

        if (xaeroApiFamily != "unsupported") {
            def minimap = artifacts["xaeros-minimap"]
            def worldMap = artifacts["xaeros-world-map"]
            if (minimap == null || worldMap == null) {
                throw new GradleException("Both Xaero contract artifacts must resolve")
            }
            requireTokens(requireClass(worldMap, "xaero/map/radar/tracker/system/IPlayerTrackerSystem.class"),
                    "Xaero World Map ${minecraftTargetVersion} tracker", ["getReader", "getTrackedPlayerIterator"])
            requireTokens(requireClass(worldMap, "xaero/map/radar/tracker/system/ITrackedPlayerReader.class"),
                    "Xaero World Map ${minecraftTargetVersion} reader", ["getId", "getX", "getY", "getZ", "getDimension"])
            requireTokens(requireClass(worldMap, "xaero/map/radar/tracker/system/PlayerTrackerSystemManager.class"),
                    "Xaero World Map ${minecraftTargetVersion} manager", ["register"])
            requireTokens(requireClass(minimap, "xaero/common/minimap/waypoints/Waypoint.class"),
                    "Xaero Minimap ${minecraftTargetVersion} Waypoint",
                    ["getX", "getY", "getZ", "getName", "getSymbol", "getColor"])
            if (xaeroApiFamily == "legacy-session") {
                requireTokens(requireClass(minimap, "xaero/common/XaeroMinimapSession.class"),
                        "Xaero Minimap ${minecraftTargetVersion} session", ["getWaypointsManager"])
                requireTokens(requireClass(minimap, "xaero/common/minimap/waypoints/WaypointWorld.class"),
                        "Xaero Minimap ${minecraftTargetVersion} world", ["getCurrentSet"])
                requireTokens(requireClass(minimap, "xaero/common/minimap/waypoints/WaypointSet.class"),
                        "Xaero Minimap ${minecraftTargetVersion} set", ["getList"])
            } else {
                requireTokens(requireClass(minimap, "xaero/common/minimap/MinimapProcessor.class"),
                        "Xaero Minimap ${minecraftTargetVersion} processor", ["getSession"])
                requireTokens(requireClass(minimap, "xaero/hud/minimap/world/MinimapWorld.class"),
                        "Xaero Minimap ${minecraftTargetVersion} world", ["getCurrentWaypointSet"])
                requireTokens(requireClass(minimap, "xaero/hud/minimap/waypoint/set/WaypointSet.class"),
                        "Xaero Minimap ${minecraftTargetVersion} set", ["getWaypoints", "add", "remove"])
            }
        }
    }
}

if (journeyMapApiNestedPath != null) {
    configurations {
        journeyMapApiBundle
    }
    dependencies {
        journeyMapApiBundle(journeyMapDependency) {
            transitive = false
        }
    }
    tasks.register("extractJourneyMapApi", Copy) {
        from({ zipTree(configurations.journeyMapApiBundle.singleFile) }) {
            include journeyMapApiNestedPath
        }
        into layout.buildDirectory.dir("generated/journeymap-api")
    }
    tasks.named("compileClientJava") {
        dependsOn tasks.named("extractJourneyMapApi")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", fabricMinecraftVersionRange
    inputs.property "loader_version", loaderVersion
    inputs.property "fabric_api_mod_id", fabricApiModId
    inputs.property "java_version", gameJavaVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": fabricMinecraftVersionRange,
                "loader_version": loaderVersion,
                "fabric_api_mod_id": fabricApiModId,
                "java_version": gameJavaVersion
    }
}

tasks.named("processClientResources") {
    inputs.property "java_version", targetJavaVersion
    filteringCharset = "UTF-8"

    filesMatching(["teamviewer.client.mixins.json", "teamviewer.journeymap.mixins.json"]) {
        expand "java_version": targetJavaVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register("verifyVersionAdapterBoundary") {
    group = "verification"
    description = "Keep Minecraft version sources behind the Common Adapter SDK boundary."
    inputs.files(fileTree("src/version") { include "**/*.java" },
            fileTree("src/compat") { include "**/*.java" }, fileTree("src/shared") { include "**/*.java" })

    doLast {
        def forbiddenImports = [
                "fun.prof_chen.teamviewer.main_code.config.Config",
                "fun.prof_chen.teamviewer.main_code.bridge.NetworkManager",
                "fun.prof_chen.teamviewer.main_code.client.ClientCoordinator",
                "fun.prof_chen.teamviewer.main_code.sync.core.",
                "fun.prof_chen.teamviewer.main_code.sync.impl.repository.",
                "fun.prof_chen.teamviewer.protocol."
        ]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            sourceFile.eachLine { line, lineNumber ->
                def trimmed = line.trim()
                if (trimmed.startsWith("import ") && forbiddenImports.any { trimmed.contains(it) }) {
                    violations << "${sourceFile}:$lineNumber: ${trimmed}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Version adapter imported common implementation details:\n" + violations.join("\n"))
        }
    }
}

tasks.register("verifyAdapterSdkCompleteness") {
    group = "verification"
    description = "Verify every supported Minecraft adapter supplies the complete SDK bundle and feature ports."
    inputs.files(adapterSourceLayout.entries.values())
    inputs.property("minecraftAdapterVersion", minecraftAdapterVersion)

    doLast {
        [minecraftAdapterVersion].each { adapter ->
            def entry = adapterSourceLayout.file(
                    "java/fun/prof_chen/teamviewer/main_code/core/FabricClientAdapterFactory.java")
            if (entry == null || !entry.isFile()) throw new GradleException("Missing ${adapter} adapter factory")
            def requiredFiles = [
                    "client/bridge/FabricClientEventBridge.java",
                    "client/bridge/FabricGameClientBridge.java",
                    "render/FabricWorldRenderSink.java",
                    "render/FabricHudRenderSink.java",
                    "screen/ConfigScreen.java",
                    "screen/PluginManagerScreen.java"
            ]
            requiredFiles.each { relative ->
                if (adapterSourceLayout.file("java/fun/prof_chen/teamviewer/main_code/${relative}") == null) {
                    throw new GradleException("${adapter} adapter missing required port ${relative}")
                }
            }
            if (journeyMapApiFamily.startsWith("api-v2")) {
                journeyMapAnnotationKind(adapterSourceLayout.file(
                        "java/fun/prof_chen/teamviewer/main_code/mapbridge/provider/journey/JourneyMapClientPlugin.java"))
            }
            if (["1.18.2", "1.19.2", "1.19.4", "1.20.1", "1.20.2", "1.20.4", "1.20.6",
                 "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8"].contains(adapter)) {
                def eventBridge = adapterSourceLayout.file(
                        "java/fun/prof_chen/teamviewer/main_code/client/bridge/FabricClientEventBridge.java")
                def eventBridgeText = eventBridge.getText("UTF-8")
                if (!eventBridgeText.contains("WorldRenderEvents.LAST.register(handler::onWorldRender)") ||
                        eventBridgeText.contains("WorldRenderEvents.AFTER_ENTITIES.register(handler::onWorldRender)")) {
                    throw new GradleException(
                            "${adapter} immediate renderer must run in WorldRenderEvents.LAST")
                }
            }
            if (["1.18.2", "1.19.2", "1.19.4"].contains(adapter)) {
                def batchRenderer = adapterSourceLayout.file(
                        "java/fun/prof_chen/teamviewer/main_code/bridge/FabricWorldRenderBatchRenderer.java")
                def renderCompat = adapterSourceLayout.file(
                        "java/fun/prof_chen/teamviewer/main_code/bridge/FabricLegacyRenderCompat.java")
                def apiCompat = adapterSourceLayout.file(
                        "java/fun/prof_chen/teamviewer/main_code/bridge/FabricLegacyApiCompat.java")
                if (batchRenderer == null || renderCompat == null || apiCompat == null) {
                    throw new GradleException("${adapter} legacy renderer must provide batch core and API compat")
                }
                def batchText = batchRenderer.getText("UTF-8")
                def compatText = renderCompat.getText("UTF-8")
                def apiText = apiCompat.getText("UTF-8")
                def renderText = batchText + "\n" + compatText + "\n" + apiText
                if (!batchText.contains("WorldRenderBatch.LineBatch") ||
                        !batchText.contains("WorldRenderBatch.QuadBatch") ||
                        !batchText.contains("VertexFormat.DrawMode.LINES, VertexFormats.LINES") ||
                        !batchText.contains("FabricLegacyRenderCompat.addLineVertex") ||
                        !apiText.contains(".normal(normalX, normalY, normalZ).next();") ||
                        !compatText.contains("cache.computeIfAbsent(width") ||
                        !apiText.contains("RenderSystem.setShader(GameRenderer::getRenderTypeLines") ||
                        !apiText.contains("RenderSystem.setShader(GameRenderer::getPositionColor") ||
                        renderText.contains("UnifiedRenderModule") ||
                        renderText.contains("WorldRenderer.drawBox") ||
                        renderText.contains("RenderLayer.getLineStrip()") ||
                        renderText.contains("VertexFormat.DrawMode.DEBUG_LINE_STRIP")) {
                    throw new GradleException(
                            "${adapter} renderer must batch camera-relative lines/quads with complete LINES normals")
                }
            }
            if (["1.20.1", "1.20.2", "1.20.4", "1.20.6", "1.21.1", "1.21.3", "1.21.4",
                 "1.21.5", "1.21.8", "1.21.9", "1.21.10"].contains(adapter)) {
                def renderSources = adapterSourceLayout.javaFiles.findAll { source ->
                    source.path.contains("/main_code/bridge/") &&
                            (source.name == "FabricWorldRenderBatchRenderer.java" ||
                                    source.name == "FabricRenderLayerCompat.java")
                }.collect { it.getText("UTF-8") }.join("\n")
                if (!renderSources.contains("DrawMode.DEBUG_LINES") ||
                        !renderSources.contains("RenderLayer.getDebugLineStrip") ||
                        renderSources.contains("DrawMode.DEBUG_LINE_STRIP")) {
                    throw new GradleException(
                            "${adapter} batch renderer must use independent DEBUG_LINES")
                }
            }
            def gameBridge = adapterSourceLayout.file(
                    "java/fun/prof_chen/teamviewer/main_code/client/bridge/FabricGameClientBridge.java")
            def gameBridgeText = gameBridge.getText("UTF-8")
            def gameClientSources = adapterSourceLayout.javaFiles.findAll { source ->
                source.name.endsWith("GameClientBridge.java")
            }.collect { it.getText("UTF-8") }.join("\n")
            if (!gameClientSources.contains("normalizeMarkTargetDistance(maxDistance)")) {
                throw new GradleException("${adapter} mark targeting must use the SDK distance bound")
            }
            if (adapter == "1.21.8" && gameClientSources.contains("crosshairTarget")) {
                throw new GradleException(
                        "${adapter} mark targeting must raycast beyond Minecraft's interaction-limited crosshairTarget")
            }
            def mixin = adapterSourceLayout.file("resources/teamviewer.client.mixins.json")
            if (!mixin.isFile() || !mixin.getText("UTF-8").contains("Mixin\"")) {
                throw new GradleException("${adapter} adapter must declare a non-empty Scoreboard Mixin list")
            }
        }
    }
}

